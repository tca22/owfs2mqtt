# OWFS2MQTT - automatic FHEM STATE formatting
#
# This notify watches the device_type reading of automatically created
# owfs_* MQTT2_DEVICE devices and assigns a suitable stateFormat once.
# The MQTT payload remains unchanged; this is FHEM presentation logic only.

define owfs2mqtt_stateFormat notify owfs_.*:device_type:.* {\\
  my $dt = ReadingsVal($NAME,"device_type","");;\\
  my $alias = ReadingsVal($NAME,"alias","");;\\
  my $sf = "";;\\
  if ($dt =~ /^(DS18B20|DS18S20|DS1822)$/) { $sf = '{sprintf("%.1f",ReadingsVal("$NAME","temperature",0))."°C"}';; }\\
  elsif ($dt eq "DS2438") { $sf = ($alias eq "pressure") ? "pressure bar" : "VDD V";; }\\
  elsif ($dt eq "DS2413") { $sf = "A: PIO_A | B: PIO_B";; }\\
  elsif ($dt eq "DS2401" || $dt eq "DS1420") { $sf = "available";; }\\
  if ($sf ne "" && AttrVal($NAME,"stateFormat","") eq "") { fhem("attr $NAME stateFormat $sf");; }\\
}
